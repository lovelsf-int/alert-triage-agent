name: alert-triage-langgraph

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${PGDATABASE:-alert_agent}
      POSTGRES_USER: ${PGUSER:-alert_agent}
      POSTGRES_PASSWORD: ${PGPASSWORD:-alert_agent}
    ports:
      - "${PGPORT:-5433}:5432"
    volumes:
      - langgraph-pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-alert_agent} -d ${PGDATABASE:-alert_agent}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    profiles: ["app"]
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${PGUSER:-alert_agent}:${PGPASSWORD:-alert_agent}@postgres:5432/${PGDATABASE:-alert_agent}
      LANGGRAPH_STRICT_MSGPACK: "true"
    ports:
      - "${SERVER_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  langgraph-pgvector-data:

name: alert-triage-agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: alert-triage-pgvector
    environment:
      POSTGRES_DB: ${PGDATABASE:-alert_agent}
      POSTGRES_USER: ${PGUSER:-alert_agent}
      POSTGRES_PASSWORD: ${PGPASSWORD:-alert_agent}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-alert_agent} -d ${PGDATABASE:-alert_agent}"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    container_name: alert-triage-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  app:
    profiles: ["app"]
    build: .
    container_name: alert-triage-agent
    env_file:
      - .env
    environment:
      PGHOST: postgres
      PGPORT: 5432
      ELASTICSEARCH_URIS: http://elasticsearch:9200
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

volumes:
  pgvector-data:
  elasticsearch-data:
